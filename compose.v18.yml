# Gemini-only Work inference and native Gemini Live, single-host V18 overlay.
# Use: docker compose -f compose.production.yml -f compose.v18.yml up -d
services:
  worker:
    environment:
      RIZZLER_AGENTIC_ENABLED: "1"
      RIZZLER_WORK_ORCHESTRATOR: deepagents
      RIZZLER_WORK_LLM_BACKEND: gemini
      RIZZLER_GEMINI_MODEL: ${RIZZLER_WORK_PRIMARY_MODEL:-gemini-3.8-flash}
      RIZZLER_WORK_FALLBACK_MODELS: ${RIZZLER_WORK_FALLBACK_MODELS:-gemini-3.7-flash,gemini-3.8-flash}
      RIZZLER_QA_MODEL: ${RIZZLER_WORK_REVIEW_MODEL:-gemini-3.7-flash}
      RIZZLER_WORK_PROVIDER_RPM: ${RIZZLER_WORK_PROVIDER_RPM:-6}
      RIZZLER_WORK_PROVIDER_TPM: ${RIZZLER_WORK_PROVIDER_TPM:-24000}
      RIZZLER_WORK_PROVIDER_PARALLEL: ${RIZZLER_WORK_PROVIDER_PARALLEL:-1}
      RIZZLER_WORK_PROVIDER_GAP_SECONDS: ${RIZZLER_WORK_PROVIDER_GAP_SECONDS:-1.5}
      RIZZLER_WORK_PROVIDER_WAIT_SECONDS: ${RIZZLER_WORK_PROVIDER_WAIT_SECONDS:-35}
      RIZZLER_ARTIFACT_QA: agentic
      RIZZLER_V15_COGNITIVE_QA: "1"
  api:
    environment:
      RIZZLER_WORK_ORCHESTRATOR: deepagents
      RIZZLER_WORK_LLM_BACKEND: gemini
      RIZZLER_GEMINI_MODEL: ${RIZZLER_WORK_PRIMARY_MODEL:-gemini-3.8-flash}
      RIZZLER_LIVE_MODEL: ${RIZZLER_LIVE_MODEL:-gemini-3.1-flash-live-preview}
