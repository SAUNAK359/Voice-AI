name: Rizzler App CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lean app and test dependencies
        run: pip install -e '.[test,work,deepagents]' -r requirements-identity.txt
      - name: Run app-only tests (no cloud credentials or GPU)
        run: python -m pytest -q tests/test_app_phase0.py tests/test_v10_phase1.py tests/test_v10_phase2.py tests/test_v10_phase3.py tests/test_phase3_evaluation.py tests/test_v10_phase4.py tests/test_v10_phase5.py tests/test_specialists.py tests/test_stack.py tests/test_v10_unified.py tests/test_v11_phase1.py tests/test_v11_phase2.py tests/test_v11_phase2_hardening.py tests/test_v11_phase3.py tests/test_v11_phase3_metrics.py tests/test_v11_phase4.py tests/test_v11_phase4_native.py tests/test_v11_phase4_integration.py tests/test_v11_phase5.py tests/test_v11_pdf_complete.py tests/test_v11_phase6.py tests/test_v11_phase6_runtime.py tests/test_v11_phase6_hardening.py tests/test_v11_phase6_admission.py tests/test_v12_agent_runtime.py tests/test_v12_dynamic_work.py tests/test_v13_studio.py tests/test_v14_large_sources.py tests/test_v14_rendering.py tests/test_v14_corpus.py tests/test_v14_final_features.py tests/test_v14_final_integration.py tests/test_v14_planning_recovery.py tests/test_v14_live_schema.py tests/test_v15_cognitive.py tests/test_v15_acceptance_hardening.py tests/test_v15_async_wait.py tests/test_v15_cognitive_preflight.py tests/test_v15_sglang_artifacts.py tests/test_v15_mvp_mcp_scale.py
      - name: V16 Deep Agents and keyless research boundary tests
        env:
          GEMINI_API_KEY: ""
          RIZZLER_WORK_ORCHESTRATOR: deepagents
          RIZZLER_SEARCH_BACKEND: searxng
          RIZZLER_WORK_LLM_BACKEND: sglang
        run: python -m pytest -q tests/test_v16_deepagents.py tests/test_v16_searxng.py tests/test_v16_shared_memory.py tests/test_v16_provider_retry.py tests/test_v17_graph_exec.py tests/test_v17_live_handoff_memory.py tests/test_v17_structured_research.py tests/test_v17_provider_faults.py
      - name: Run synthetic multi-agent end-to-end artifact acceptance
        run: python scripts/qualify_mvp.py --offline --output /tmp/rizzler-mvp-acceptance
      - name: Validate the canonical native Kaggle notebook
        run: python scripts/validate_native_notebook.py
      - name: Verify wheel bundles all six specialist skill playbooks
        run: |
          python -m pip wheel . --no-deps -w /tmp/rizzler-wheels
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("/tmp/rizzler-wheels").glob("*.whl"))
          expected = {"research", "sql_analytics", "powerpoint", "word", "excel", "pdf_visual"}
          with ZipFile(wheel) as z:
              found = {p.split("/")[-2] for p in z.namelist()
                       if p.startswith("rizzler/agent_skills/") and p.endswith("/SKILL.md")}
          assert found == expected, (found, expected)
          print("Six specialist SKILL.md files included in installable wheel")
          PY
      - name: Validate reasoning benchmark runner syntax
        run: python -m py_compile scripts/evaluate_reasoning.py
      - name: Check source syntax
        run: python -m compileall -q src/rizzler
      - name: Evaluate frozen voice tool routing (no side-effect false positives)
        run: python scripts/evaluate_tool_routing.py --output /tmp/rizzler_v11_routing.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JS syntax
        run: |
          node --check src/rizzler/web/app.js
          node --check src/rizzler/web/native-live.js
          node --check src/rizzler/web/studio.js
          node --check src/rizzler/web/dashboard.js
          node --check src/rizzler/web/capture.js
          node --check src/rizzler/web/voice-core.js
          node --check src/rizzler/web/capture.js
          node --check src/rizzler/web/work.js
          node --check src/rizzler/web/rich-text.js
          node --check stack_site.js
      - name: Browser voice regression tests
        run: node --test tests/test_voice_core.cjs tests/test_voice_phase3.cjs tests/test_rich_text.cjs
